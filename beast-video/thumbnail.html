<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thumbnail — The Beast Unchained (1280x720)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}
  .thumb{position:relative;width:1280px;height:720px;max-width:96vw;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
  .thumb .shade{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.9) 0%, transparent 55%), radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.7) 100%)}
  .thumb .text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:56px;text-align:center}
  .thumb .small{letter-spacing:.35em;text-transform:uppercase;color:#ffb347;font-weight:800;font-size:22px;margin-bottom:10px}
  .thumb .big{font-size:92px;font-weight:900;line-height:.95;text-transform:uppercase;text-shadow:0 6px 40px rgba(0,0,0,.9)}
  .thumb .big .red{color:#e10600;text-shadow:0 0 40px rgba(225,6,0,.8)}
  .hint{color:#9a9aa3;margin-top:14px;font-size:13px}
</style>
</head>
<body>
  <div class="thumb">
    <img src="assets/beast-roar.jpg" alt="">
    <div class="shade"></div>
    <div class="text">
      <div class="small">DeathPiggy • Lyric Video</div>
      <div class="big">This <span class="red">Fucking</span> Beast!</div>
    </div>
  </div>
  <div class="hint">Screenshot this at 1280×720 for your YouTube thumbnail. Swap <code>assets/beast-roar.jpg</code> for <code>beast-hero.jpg</code> for an alternate.</div>
</body>
</html>
